<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="18" y1="12" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="36" y1="34" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Kiosk Stand Body -->
  <rect x="15" y="9" width="28" height="40" rx="4" fill="#FFFFFF" />
  <!-- Kiosk Display Screen -->
  <rect x="18" y="12.5" width="22" height="22" rx="2.5" fill="url(#screenGrad)" />
  <!-- Screen UI Lines (Order List) -->
  <rect x="21" y="16" width="10" height="2.2" rx="1.1" fill="#4338CA" />
  <rect x="21" y="20.5" width="16" height="2" rx="1" fill="#6366F1" />
  <rect x="21" y="24.5" width="13" height="2" rx="1" fill="#6366F1" />
  <rect x="21" y="28.5" width="8" height="2.2" rx="1.1" fill="#4F46E5" />

  <!-- Kiosk Card Slot & Receipt Slot -->
  <rect x="20" y="38" width="10" height="2.2" rx="1.1" fill="#94A3B8" />
  <rect x="33" y="37.5" width="4" height="3.2" rx="1" fill="#6366F1" />
  <rect x="20" y="43" width="18" height="2" rx="1" fill="#CBD5E1" />

  <!-- Kiosk Base -->
  <path d="M11 49H47C48.1046 49 49 49.8954 49 51V53H9V51C9 49.8954 9.89543 49 11 49Z" fill="#E0E7FF" />

  <!-- Order Check Badge -->
  <circle cx="45" cy="43" r="10.5" fill="url(#accentGrad)" stroke="#1E1B4B" stroke-width="2.5" />
  <path d="M40.5 43.2L43.4 46.1L49.8 39.7" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
